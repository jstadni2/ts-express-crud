services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avdb-web-auth
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
    volumes:
      - ./.certs:/certs
    ports:
      - "443:443"
    depends_on:
      db:
        condition: service_healthy
