# Resources with hard-coded secrets for local development or CI/CD testing.
# NEVER USE THIS IN PRODUCTION DEPLOYMENTS.
services:
  db:
    image: postgres:16
    container_name: ${DB_CONTAINER_NAME:-avdb-postgres}
    environment:
      POSTGRES_USER: avdb
      POSTGRES_PASSWORD: avdb
      POSTGRES_DB: avdb
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avdb -d avdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: avdb-web
    environment:
      NODE_ENV: development
      SECRET_KEY: dev-secret-key
      DATABASE_URL: postgresql://avdb:avdb@db:5432/avdb
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
